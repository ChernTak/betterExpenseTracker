name: expense_tracker
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # HTTP client used by the services layer to call the Node.js backend
  http: ^1.2.2

  # Encrypted on-device storage for the JWT session token
  flutter_secure_storage: ^9.2.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1

  # FR4.2/FR4.3 — receipt photo capture and on-device OCR (Google ML Kit)
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_document_scanner: ^0.4.0

  # Local vendor->category cache for auto-categorization (sqflite DB)
  sqflite: ^2.4.1
  path: ^1.9.1

  # Device GPS for the location-based food recommendation feature
  geolocator: ^13.0.2
  # Tap-to-call / tap-to-open-website / directions on the venue detail screen
  url_launcher: ^6.3.1

  # On-device inference for the Tier B spend-forecast regressor (see
  # ai/train_tier_b.py and lib/services/tier_b_inference_service.dart)
  tflite_flutter: ^0.12.1
  # OTA model delivery for the above: local storage for a downloaded model
  # file, and cheap persisted state for the last-known version/check time.
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Hands-free voice expense logging (FR4.4).
  # Wake word: fully local, grammar-restricted Vosk recognizer. Using the
  # community-maintained vosk_flutter_2 fork, not the original vosk_flutter
  # — the original still pins http ^0.13.5, which conflicts with this app's
  # http ^1.2.2 (used everywhere else); vosk_flutter_2 tracks current deps.
  vosk_flutter_2: ^1.0.5
  # Full-vocabulary transcription after the wake word fires — native
  # Android SpeechRecognizer / iOS SFSpeechRecognizer, free and on-device.
  speech_to_text: ^7.0.0
  # Already a transitive dependency of vosk_flutter_2 (mic/speech
  # permission prompts) — declared directly too now that MainShell also
  # calls openAppSettings() to help with OEM battery-optimization killing
  # the hands-free listener.
  permission_handler: ^11.3.1
  # Runtime Build.VERSION.SDK_INT check — vosk_flutter_2 declares
  # minSdkVersion 30 in its own manifest, and this app deliberately doesn't
  # match that app-wide (see android/app/build.gradle.kts's
  # tools:overrideLibrary comment); WakeWordService uses this to gate
  # itself off cleanly below API 30 instead of risking an unverified native
  # call into code the plugin never claimed to support there.
  device_info_plus: ^12.4.0

  # Resize/normalize the receipt photo into the fixed 224x224 pixel_values
  # tensor the on-device receipt NER model (LayoutLMv3) expects — see
  # lib/services/receipt_ner/image_preprocessor.dart.
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled Tier B spend-forecast model (see ai/train_tier_b.py) — loaded by
  # lib/services/tier_b_inference_service.dart via tflite_flutter.
  assets:
    - assets/models/tier_b_regressor.tflite
    # Manually downloaded — see assets/models/README.md. Not fetched by
    # `pub get`; the app fails to start hands-free listening without it.
    - assets/models/vosk-model-small-en-us-0.15.zip
    # Receipt NER (LayoutLMv3) tokenizer vocab — small (~1.2MB combined),
    # bundled directly unlike the 153MB .tflite model itself, which is
    # OTA-only (see lib/services/receipt_ner/). Copied verbatim from
    # ai/saved_pytorch_model_v3/{vocab.json,merges.txt} — re-copy if the
    # model is ever retrained, since a mismatched vocab would silently
    # produce wrong token IDs.
    - assets/models/receipt_ner_vocab.json
    - assets/models/receipt_ner_merges.txt

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
